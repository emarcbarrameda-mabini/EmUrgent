{% extends 'base/base.html' %}

{% block content %}
<div class="auth-card">
    <div class="text-center">
        <i class="fas fa-check-circle" style="font-size: 48px; color: #22c55e; margin-bottom: 16px;"></i>
        <h2>Check Your Email</h2>
        <p>We've sent password reset instructions to your email address</p>
    </div>

    <div style="background: #f0fdf4; border: 2px solid #86efac; border-radius: 12px; padding: 12px; margin-top: 16px; text-align: center;">
        <p style="color: #22c55e; font-size: 14px; margin: 0;">
            <strong>Check your inbox and spam folder</strong> for the reset link. Click the link to create a new password.
        </p>
    </div>

    <div class="text-center" style="margin-top: 12px;">
        <p class="small" style="color: #9ca3af; margin: 0 0 8px 0;">Didn't receive the email?</p>
        <a href="{% url 'password_reset' %}" class="auth-link">Try again</a>
    </div>
</div>
{% endblock %}
