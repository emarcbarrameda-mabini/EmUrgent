{% extends 'base/base.html' %}

{% block title %}Password Reset Complete - i-Sumbong{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Password Reset Complete</h2>
        <p class="subtitle">Your password has been successfully reset.</p>

        <div class="auth-callout auth-callout-success">
            <i class="fas fa-check-circle auth-status-icon auth-success-icon"></i>
            <p><strong>Password reset successful!</strong></p>
            <p>You can now log in with your new password.</p>
        </div>

        <p class="auth-footer">
            <a href="{% url 'login' %}" class="link-style">Back to Login</a>
        </p>

        <button onclick="window.location='{% url 'login' %}'" class="btn-modern btn-login auth-submit">
            Go to Login
        </button>
    </div>
</div>
{% endblock %}
