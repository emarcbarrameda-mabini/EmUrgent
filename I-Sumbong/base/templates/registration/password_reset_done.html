{% extends 'base/base.html' %}

{% block content %}
<div class="auth-card">
    <div class="text-center">
        <i class="fas fa-check-circle auth-status-icon auth-success-icon"></i>
        <h2>Check Your Email</h2>
        <p>We've sent password reset instructions to your email address</p>
    </div>

    <div class="auth-callout auth-callout-success">
        <p>
            <strong>Check your inbox and spam folder</strong> for the reset link. Click the link to create a new password.
        </p>
    </div>

    <div class="auth-footer">
        <p class="small auth-muted">Didn't receive the email?</p>
        <a href="{% url 'password_reset' %}" class="auth-link">Try again</a>
    </div>
</div>
{% endblock %}
