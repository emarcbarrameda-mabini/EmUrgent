<aside class="admin-sidenav" role="navigation" aria-label="Admin sidebar">
    <div class="admin-sidenav-header">
        <div class="admin-brand">
            <div class="admin-brand-icon"><i class="fas fa-bullhorn" aria-hidden="true"></i></div>
            <div>
                <span class="admin-brand-title">i-Sumbong</span>
                <span class="admin-brand-sub">Barangay</span>
            </div>
        </div>
    </div>

    <nav class="admin-nav" aria-label="Admin features">
        <a href="#" class="admin-nav-link active" data-target="section-dashboard">
            <i class="fas fa-gauge-high" aria-hidden="true"></i>
            <span>Dashboard</span>
        </a>
        <a href="#" class="admin-nav-link" data-target="section-reports">
            <i class="fas fa-file-lines" aria-hidden="true"></i>
            <span>Reports</span>
        </a>
        <a href="#" class="admin-nav-link" data-target="section-analytics">
            <i class="fas fa-chart-column" aria-hidden="true"></i>
            <span>Analytics</span>
        </a>
        <a href="#" class="admin-nav-link" data-target="section-bulletin">
            <i class="fas fa-bullhorn" aria-hidden="true"></i>
            <span>Bulletins</span>
        </a>
        <a href="#" class="admin-nav-link" data-target="section-validation">
            <i class="fas fa-user-check" aria-hidden="true"></i>
            <span>Validation Queue</span>
        </a>
        <a href="#" class="admin-nav-link" data-target="section-users">
            <i class="fas fa-users-cog" aria-hidden="true"></i>
            <span>Users</span>
        </a>
        <a href="{% url 'home' %}" class="admin-nav-link">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
            <span>Back to App</span>
        </a>
    </nav>

    <div class="admin-sidebar-ledger" aria-label="Barangay command summary">
        <div>
            <span>Total Reports</span>
            <strong>{{ total|default:"0" }}</strong>
        </div>
        <div>
            <span>Open Cases</span>
            <strong>{{ pending|default:"0"|add:in_progress|default:"0" }}</strong>
        </div>
    </div>

    <div class="admin-sidenav-footer" aria-hidden="false">
        <div class="admin-user-info">
            <div class="admin-avatar">{{ request.user.username|first|upper }}</div>
            <div>
                <p class="admin-username">{{ request.user.username }}</p>
                <p class="admin-role">Administrator</p>
            </div>
        </div>
        <form method="post" action="{% url 'logout' %}" style="margin: 0;">
            {% csrf_token %}
            <button type="submit" class="admin-logout" style="border: 0; background: transparent;" aria-label="Logout">
                <i class="fas fa-right-from-bracket" aria-hidden="true"></i>
            </button>
        </form>
    </div>
</aside>
